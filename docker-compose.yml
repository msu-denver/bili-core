volumes:
    bili-core-virtualenv:
    bili-core-postgis-data:
    bili-core-mongodb-data:
services:
    bili-core:
        build: .
        image: "bili-core"
        container_name: "bili-core"
        deploy:
            resources:
                reservations:
                    devices:
                        - count: all
                          capabilities: [gpu]
        env_file: .env
        environment:
            - PYTHON_ENV=development
            - FLASK_DEBUG=1
            - LOCALSTACK_HOSTNAME=bili-core-localstack
        volumes:
            - ".:/app/bili-core/:rw"
            - "./env/bili_root/:/root/:rw"
            - "bili-core-virtualenv:/app/bili-core/venv/"
        ports:
            - 8501:8501
            # Port 8502 removed — AETHER UI now integrated into main app on 8501
            - 5001:5001
        networks:
            bili-core:
                aliases:
                    - bili-core
        depends_on:
            - bili-core-postgis
            - bili-core-localstack
        profiles: ["gpu"]

    bili-core-cpu:
        build: .
        image: "bili-core"
        container_name: "bili-core"
        env_file: .env
        environment:
            - PYTHON_ENV=development
            - FLASK_DEBUG=1
            - LOCALSTACK_HOSTNAME=bili-core-localstack
        volumes:
            - ".:/app/bili-core/:rw"
            - "./env/bili_root/:/root/:rw"
            - "bili-core-virtualenv:/app/bili-core/venv/"
        ports:
            - 8501:8501
            # Port 8502 removed — AETHER UI now integrated into main app on 8501
            - 5001:5001
        networks:
            bili-core:
                aliases:
                    - bili-core
        depends_on:
            - bili-core-postgis
            - bili-core-localstack
        profiles: ["cpu"]

    bili-core-postgis:
        image: postgis/postgis:17-3.4
        platform: linux/amd64
        container_name: "bili-core-postgis"
        environment:
            - PGDATA=/data/db
            - POSTGRES_USER=bilicore
            - POSTGRES_PASSWORD=bilicore
        volumes:
            - "bili-core-postgis-data:/data/db/"
        ports:
            - 5432:5432
        networks:
            bili-core:
                aliases:
                    - bili-core-postgis

    bili-core-mongodb:
        image: mongo:8
        container_name: "bili-core-mongodb"
        hostname: "bili-core-mongodb"
        environment:
            MONGO_INITDB_ROOT_USERNAME: bilicore
            MONGO_INITDB_ROOT_PASSWORD: bilicore
        volumes:
            - "bili-core-mongodb-data:/data/db/"
        ports:
            - 27017:27017
        networks:
            bili-core:
                aliases:
                    - bili-core-mongodb

    bili-core-localstack:
        # Pinned to 4.14.0 (released 2026-02-26), the last LocalStack release
        # before they switched to calendar versioning (2026.03.0+) and made
        # every image (including community/free tier) require a
        # LOCALSTACK_AUTH_TOKEN. Pinning here keeps dev setup token-free.
        image: localstack/localstack:4.14.0
        container_name: "bili-core-localstack"
        hostname: "bili-core-localstack"
        ports:
            - "4566:4566"
            - "4571:4571"
        environment:
            - DEBUG=1
            - DOCKER_SOCK=/var/run/docker.sock
            - HOSTNAME_EXTERNAL=bili-core-localstack
            - PERSISTENCE=1
            - SERVICES=s3,lambda,dynamodb,ssm,ses,opensearch
        volumes:
            - "/var/run/docker.sock:/var/run/docker.sock"
            - "./env/localstack:/var/lib/localstack"
            - "./scripts/localstack/seed_localstack.sh:/etc/localstack/init/ready.d/seed_localstack.sh"
        networks:
            bili-core:
                aliases:
                    - bili-core-localstack
        healthcheck:
            # Modern LocalStack serves health at /_localstack/health. The old
            # /health path is now treated as an S3 bucket request (returns
            # NoSuchBucket XML), so the old check never matched and the container
            # was permanently "unhealthy" even though S3 worked. Match s3 in
            # either ready state ("running" or lazy "available").
            test: ["CMD-SHELL", "curl -sf http://localhost:4566/_localstack/health | grep -E '\"s3\": \"(available|running)\"'"]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 30s

networks:
    bili-core:
        name: bili-core
        external: true
