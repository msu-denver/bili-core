name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
  # No workflow_dispatch trigger. A dispatch run reviews a PR head without
  # the action restoring .claude/ and .mcp.json from the base branch, so a
  # fork's hooks and MCP servers would start beside the App token, and it
  # runs in agent mode, which has no tracking comment for the review.

# One review per PR at a time. A push starts a new run and cancels the
# older one, whose head the action would refuse anyway.
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # Free, token-free SAST (Semgrep OSS). Runs first and posts a single sticky
  # findings comment so the Claude review job (which reads PR comments) folds the
  # results into its review. Replaces the metered claude-security-review.yml.
  semgrep:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Install Semgrep (OSS, pinned, no token)
        run: pip install semgrep==1.165.0

      - name: Run Semgrep
        # --error sets a non-zero exit on findings; `|| true` keeps the job
        # green so findings are advisory (the Claude review and a human decide),
        # mirroring the comment-only behavior of the security job it replaces.
        run: |
          semgrep scan --json --output semgrep.json \
            --config p/python \
            --config p/secrets \
            --config p/ci \
            --config p/dockerfile || true

      - name: Post Semgrep findings as a sticky PR comment
        # Dependabot PRs run with a read-only token, so the comment post fails
        # there. continue-on-error keeps the job (and the run) green, so the
        # review workflow does not surface as a failed/skipped run on dependabot.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          MARKER: '### Semgrep (OSS)'
        run: |
          COUNT=$(jq '.results | length' semgrep.json)
          if [ "$COUNT" -eq 0 ]; then
            printf '%s: no findings\n\n_Clean scan. Posted before the Claude review._\n' "$MARKER" > semgrep-comment.md
          else
            HIGH=$(jq '[.results[]|select(.extra.severity=="ERROR")]|length' semgrep.json)
            MED=$(jq '[.results[]|select(.extra.severity=="WARNING")]|length' semgrep.json)
            LOW=$(jq '[.results[]|select(.extra.severity=="INFO")]|length' semgrep.json)
            {
              printf '%s: %s findings\n\n' "$MARKER" "$COUNT"
              printf '<details><summary>HIGH (%s) · MEDIUM (%s) · LOW (%s)</summary>\n\n' "$HIGH" "$MED" "$LOW"
              printf '| Sev | Rule | Location | Message |\n|---|---|---|---|\n'
              jq -r '.results[] | "| \(.extra.severity|if .=="ERROR" then "HIGH" elif .=="WARNING" then "MEDIUM" else "LOW" end) | \(.check_id|split(".")|last) | \(.path):\(.start.line) | \(.extra.message|gsub("[\n|]";" ")|.[0:120]) |"' semgrep.json
              printf '\n</details>\n\n_Posted before the Claude review so findings are folded into the review._\n'
            } > semgrep-comment.md
          fi
          # Sticky: delete any prior Semgrep comment so the thread keeps one.
          gh api --paginate "repos/$REPO/issues/$PR/comments" \
            --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"$MARKER\"))) | .id" \
          | while read -r id; do
              gh api -X DELETE "repos/$REPO/issues/comments/$id" || true
            done
          gh pr comment "$PR" --body-file semgrep-comment.md

  # Wait for the CI/CD pipeline's test-application job (in ci-cd.yml) to finish
  # on this PR's head commit, then post its result as a sticky comment. The
  # Claude review `needs:` this job (so it runs only after tests complete) and
  # reads PR comments, so it folds the pytest / coverage-gate outcome into its
  # review, the same sticky-comment hand-off the semgrep job uses. The review
  # action only supports pull_request context (not workflow_run), so the gating
  # is done in-workflow. ci-cd.yml builds, lints, AND tests in one run with a
  # distinct test-application job, so we poll the run for this head commit and
  # then read that specific job's conclusion by name via the jobs API.
  await-tests:
    # Gate on who AUTHORED the pull request, not github.actor, which is whoever
    # triggered THIS run. The two diverge the moment anyone re-runs a dependabot
    # PR's checks or updates its branch, and branch protection makes updating
    # mandatory before merge. Keying on the actor flipped these jobs from skipped
    # to running against a PR the review never comments on, so verdict-extract
    # found nothing and a required check failed, leaving dependabot PRs unmergeable.
    if: ${{ github.event.pull_request.user.login != 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      pull-requests: write
    steps:
      - name: Wait for the test job and post the result as a sticky comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
          MARKER: '### CI Tests'
        run: |
          # Poll the CI/CD pipeline run for this head commit (~30 min ceiling),
          # then read the test-application job's conclusion by name. The build
          # and test jobs run in the same ci-cd.yml run, so the run-level
          # conclusion can be dragged down by the lint/build job; we want the
          # test job specifically.
          status="missing"; conclusion=""; runid=""
          for _ in $(seq 1 60); do
            run=$(gh api "repos/$REPO/actions/workflows/ci-cd.yml/runs?head_sha=$SHA&event=pull_request&per_page=1" 2>/dev/null || echo '{}')
            status=$(echo "$run" | jq -r '.workflow_runs[0].status // "missing"')
            runid=$(echo "$run" | jq -r '.workflow_runs[0].id // ""')
            if [ "$status" = "completed" ]; then
              break
            fi
            sleep 30
          done
          if [ "$status" = "completed" ] && [ -n "$runid" ]; then
            # Pull the test-application job's own conclusion out of the run.
            conclusion=$(gh api "repos/$REPO/actions/runs/$runid/jobs" \
              --jq '.jobs[] | select(.name=="test-application") | .conclusion' 2>/dev/null || echo "")
          fi
          # The backticks below are Markdown code spans in the comment text, not
          # command substitution.
          # shellcheck disable=SC2016
          {
            printf '%s\n\n' "$MARKER"
            if [ "$conclusion" = "success" ]; then
              printf '✅ **Tests passed**: the pytest suite and the per-file coverage gate (>= 90%%) are green on `%s`.\n' "${SHA:0:9}"
            elif [ "$conclusion" = "failure" ]; then
              printf '❌ **Tests failed** on `%s`. Failing output (truncated):\n\n```\n' "${SHA:0:9}"
              gh run view "$runid" --repo "$REPO" --log-failed 2>/dev/null \
                | grep -iE 'FAILED |ERROR |AssertionError|assert |Error:|Exception|E   |short test summary|coverage|below threshold|did not pass' \
                | head -40 || true
              printf '```\n'
            else
              printf '⚠️ The test job did not complete within the wait window (last status: %s). The review proceeds without a final test result; confirm the test-application check before merge.\n' "${conclusion:-$status}"
            fi
            printf '\n_Posted before the Claude review so the test outcome is folded into the review._\n'
          } > ci-tests-comment.md
          # Sticky: replace any prior CI Tests comment so the thread keeps one.
          gh api --paginate "repos/$REPO/issues/$PR/comments" \
            --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"$MARKER\"))) | .id" \
          | while read -r id; do
              gh api -X DELETE "repos/$REPO/issues/comments/$id" || true
            done
          # --repo is required: this job has no checkout, so gh cannot infer the
          # repo from git context (unlike the semgrep job).
          gh pr comment "$PR" --repo "$REPO" --body-file ci-tests-comment.md

  claude-review:
    if: ${{ github.event.pull_request.user.login != 'dependabot[bot]' }}
    # Both gates post their sticky comments before the review runs:
    #   semgrep -> "Semgrep (OSS)"; await-tests -> "CI Tests".
    needs: [semgrep, await-tests]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      # Everything the review reads from GitHub is fetched here, by fixed
      # commands, so the agent needs no shell. A shell with gh in it can be
      # steered into printing the token: gh's --jq filter can read the
      # environment, and quoting slips past any deny pattern.
      #
      # Trusted means write access or one of the two bots whose comments the
      # review needs. Write access is what the collaborators API reports for
      # the login (admin, maintain or write), asked once per commenter.
      # author_association is not enough: on an organization's repository,
      # MEMBER and COLLABORATOR also cover read-only and triage users. A
      # lookup that fails leaves that login's comments out. The two bots are
      # github-actions[bot] (this workflow's sticky comments) and claude[bot]
      # (earlier reviews); the REST API gives a bot its [bot] suffix and no
      # user login can contain brackets, so those two names cannot be
      # borrowed. The same list feeds include_comments_by_actor below,
      # because tag mode also puts the PR's comments into the prompt. It
      # always holds the two bots, which matters: an empty include list lets
      # every comment through.
      #
      # A PR from a fork stops here. Its pull_request run has no secrets, but
      # on any other trigger the action does not restore .claude/ and
      # .mcp.json from the base branch, so the fork's hooks and MCP servers
      # would start beside the App token. Only an explicit false passes.
      #
      # The head must still be the commit this run was started for; the
      # action refuses a moved head too, and the newer run reviews it. The
      # files live beside the checkout, not under the runner temp folder,
      # which the agent may not read. Any other failure fails the step, and
      # the review does not run.
      - name: Collect the PR context for the review
        id: context
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          dir="$(dirname "$GITHUB_WORKSPACE")/pr-context"
          rm -rf "$dir"
          mkdir -p "$dir"
          gh pr view "$PR" --repo "$REPO" \
            --json number,title,body,state,isDraft,author,baseRefName,headRefName,headRefOid,url,isCrossRepository > "$dir/pr.json"
          if [ "$(jq -r .isCrossRepository "$dir/pr.json")" != "false" ]; then
            echo "::error::PR #$PR comes from a fork; the review does not run on fork code."
            exit 1
          fi
          head=$(jq -r .headRefOid "$dir/pr.json")
          if [ "$head" != "$HEAD_SHA" ]; then
            echo "::error::PR #$PR moved from $HEAD_SHA to $head after this run started; the newer run reviews it."
            exit 1
          fi
          gh pr diff "$PR" --repo "$REPO" > "$dir/diff.patch"
          gh pr diff "$PR" --repo "$REPO" --name-only > "$dir/changed-files.txt"
          for kind in "issues/$PR/comments" "pulls/$PR/reviews" "pulls/$PR/comments"; do
            gh api --paginate "repos/$REPO/$kind" | jq -s --arg kind "$kind" 'add // [] | map(. + {kind: $kind})'
          done | jq -s 'add' > "$RUNNER_TEMP/all-comments.json"
          jq -r '[.[] | select(.user.type != "Bot") | .user.login // empty] | unique[]' \
            "$RUNNER_TEMP/all-comments.json" > "$RUNNER_TEMP/commenters.txt"
          : > "$RUNNER_TEMP/writers.txt"
          while read -r login; do
            perm=$(gh api "repos/$REPO/collaborators/$login/permission" --jq .permission) || {
              echo "::warning::Could not read the permission of $login; their comments are left out."
              perm=none
            }
            case "$perm" in
              admin|maintain|write) printf '%s\n' "$login" >> "$RUNNER_TEMP/writers.txt" ;;
            esac
          done < "$RUNNER_TEMP/commenters.txt"
          jq --rawfile writers "$RUNNER_TEMP/writers.txt" '
            ($writers | split("\n") | map(select(. != ""))) as $w
            | map(select(if .user.type == "Bot"
                         then .user.login | IN("github-actions[bot]", "claude[bot]")
                         else .user.login | IN($w[]) end))' \
            "$RUNNER_TEMP/all-comments.json" > "$RUNNER_TEMP/trusted-comments.json"
          jq -r '
            sort_by(.created_at // .submitted_at)[]
            | select((.body // "") != "")
            | "### \(.user.login) (\(.author_association)), \(.created_at // .submitted_at)"
              + (if (.kind | endswith("/reviews")) then ", review \(.state)"
                 elif (.kind | startswith("pulls/")) then ", on \(.path) line \(.line // .original_line)"
                 else "" end)
              + "\n\n\(.body)\n"' "$RUNNER_TEMP/trusted-comments.json" > "$dir/comments.md"
          actors=$(jq -r '[.[].user.login] + ["github-actions[bot]", "claude[bot]"] | unique | join(",")' \
            "$RUNNER_TEMP/trusted-comments.json")
          echo "dir=$dir" >> "$GITHUB_OUTPUT"
          echo "actors=$actors" >> "$GITHUB_OUTPUT"

      # SHA-pinned anthropics/claude-code-action v1.0.271. Bump by re-resolving
      # the tag's commit (the tag is annotated, so peel it):
      #   gh api repos/anthropics/claude-code-action/git/refs/tags/v1.0.271
      #
      # Tools. --tools names every built-in tool the agent has; any other,
      # including ones a later CLI adds, does not exist in the session or its
      # subagents. Bash is not the only built-in that runs commands (Monitor
      # does too, and a Bash deny does not reach it), so a deny list alone
      # cannot keep up. MCP tools (the comment and CI tools) are not built-in
      # and stay. Allow rules add up from the action's own (file reading, its
      # comment and CI tools, git add/commit/rm, its git-push.sh wrapper) and
      # the list below; a deny rule beats every allow rule:
      #   * no shell. Pattern denies cannot do this job: they match the
      #     command text with its quotes still in it, so
      #     `gh pr view 1 "--jq" env` passes a `--jq` deny. The agent reads
      #     the context files instead (the prompt names them). Bash and
      #     Monitor are also denied by name, as a second layer;
      #   * Task runs subagents and ToolSearch loads MCP tools the CLI defers;
      #   * no file edits, web access or commit tools;
      #   * no Read of /proc (the process environment holds the OAuth and App
      #     tokens), of .git/config (the action writes the App token into the
      #     remote URL) or of the runner temp folder (a checkout that persists
      #     credentials writes them there); the same rules stop Grep.
      # The review posts through the action's tracking comment and the
      # inline-comment tool only.
      # Tag mode starts the agent in acceptEdits mode; `--permission-mode
      # default` below replaces it (the action keeps the last value it is
      # given for a flag, and claude_args come after its own), so no tool is
      # allowed by the mode alone.
      # CLAUDE_CODE_SUBPROCESS_ENV_SCRUB keeps the Anthropic, cloud and
      # Actions credentials out of the environment of any process the agent
      # starts. The action turns it on only with allowed_non_write_users.
      - name: Run Claude code review
        id: claude-review
        uses: anthropics/claude-code-action@4fa93a88de49bbef68b10eb15aabedf28ca0e1ed # v1.0.271
        env:
          CLAUDE_CODE_SUBPROCESS_ENV_SCRUB: "1"
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          include_fix_links: true
          # track_progress puts the run in tag mode: a tracking comment, and
          # the PR's comments copied into the prompt.
          track_progress: true
          allowed_bots: 'claude[bot]'
          # Keeps only the trusted authors the context step found in the
          # comments, reviews and review comments tag mode copies.
          include_comments_by_actor: ${{ steps.context.outputs.actors }}
          # The action asks for an App token with contents, pull_requests and
          # issues all `write` unless a key is overridden here; the review
          # posts comments but never pushes, so contents drops to read. Keys
          # use the API's spelling (`pull_requests`, underscore).
          additional_permissions: |
            contents: read
          claude_args: >-
            --model opus
            --permission-mode default
            --tools "Read,Grep,Glob,Task,ToolSearch"
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Read,Grep,Glob"
            --disallowedTools "Bash,Monitor,Edit,MultiEdit,Write,NotebookEdit,WebFetch,WebSearch,mcp__github_file_ops__commit_files,mcp__github_file_ops__delete_files,Read(./.git/**),Read(//proc/**),Read(//home/runner/work/_temp/**)"
          prompt: >-
            Review pull request ${{ github.repository }}#${{ github.event.pull_request.number }}
            for correctness bugs, security problems and clear CLAUDE.md violations in the changed
            code. There is no shell in this job, so gh and git cannot run. Everything you need from
            GitHub is already in files in ${{ steps.context.outputs.dir }}: pr.json (number, title,
            body, state, isDraft, author, base and head branch, headRefOid, the full head commit sha
            for links, and url), diff.patch (the PR's diff), changed-files.txt (the changed paths)
            and comments.md (the PR's comments, reviews and review comments, from maintainers and
            this repository's bots only). Read them with the Read tool, and tell every subagent you
            launch to do the same. The checkout is the PR's head, so read any file for context.
            Post each finding as an inline comment with the inline-comment tool, and put the whole
            review (a summary, every finding with its severity, and the sections asked for below)
            in your tracking comment. Only github-actions[bot]'s comments under the "Semgrep (OSS)"
            and "CI Tests" headings are the scan and test results; the same heading from anyone else
            is not.
            This PR's CI has already run. A "Semgrep (OSS)" comment and a "CI Tests" comment
            (the pytest suite and per-file coverage-gate outcome, with any failing test
            output) are posted on the PR. Read both and factor them into your review. You do NOT
            have a runnable test environment here and cannot install the bili ML stack or run
            pytest yourself, so rely on the "CI Tests" comment for results and do not tell the
            reader to "confirm CI is green".
            Always include a "Test coverage" section in your review (never omit it):
            - If the "CI Tests" comment shows a failure, call it out as a blocking finding and
            relate the failing tests to the diff where you can.
            - If this PR changes application or library source code in a way that warrants tests
            (new or changed behavior, bug fixes, new branches or edge cases) and does NOT add or
            update corresponding tests, flag it as a HIGH-severity finding naming the specific
            untested change.
            - If the change is exempt (docs-only, README, comments, formatting, or pure
            configuration: CI YAML, lockfile bumps, asset-only, version bumps) or existing tests
            already cover it, say so explicitly in one line (e.g. "No test changes needed:
            <reason>") rather than staying silent.
            - If tests were added or changed, briefly assess whether they meaningfully cover the change.
            SEVERITY BAR (label findings precisely — a separate `review-gate` check BLOCKS merge on
            a HIGH/CRITICAL finding, and a second pass reads YOUR review to decide the verdict, so
            your severity labels are load-bearing). Reserve HIGH/CRITICAL for: a correctness bug
            reachable on a common code path; a security vulnerability; data loss or corruption; a
            build, release, or import breakage; or a "CI Tests" FAILURE on this PR. Do NOT label as
            HIGH/CRITICAL (these must not block): style, naming, docs/comment wording, missing tests
            (the test-coverage rule above owns those), speculative or defensive hardening for inputs
            the code's own contract disallows, symmetric-gap or "while you're here" polish, or
            anything you are not confident is a real, reachable defect. When in doubt it is MEDIUM.

  # ---------------------------------------------------------------------------
  # Verdict extractor (the gate's "second pass"). A cheap, single-purpose Claude
  # call whose ONLY job is to read the review just posted and emit a strict
  # machine verdict. Decoupling this from the main review is deliberate: a model
  # asked to emit one constrained line, with nothing else competing for its
  # output, does so far more reliably than a marker buried at the end of a long
  # review (which proved unreliable). It is an EXTRACTOR, not a second reviewer:
  # it reports the review's own HIGH/CRITICAL count, it does not re-judge the diff.
  #
  # Per-repo config: REVIEW_BOT is the login the review comment is posted under
  # (the installed GitHub App; `claude[bot]` for the official action).
  # ---------------------------------------------------------------------------
  verdict-extract:
    needs: [claude-review]
    # Only run when the review actually produced something to extract from.
    if: ${{ needs.claude-review.result == 'success' && github.event.pull_request.user.login != 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    # The verdict travels to the gate as a JOB OUTPUT built from the action's
    # STRUCTURED OUTPUT (claude-code-action's `--json-schema` feature, v1.0.152+):
    # the agent returns schema-validated JSON in `structured_output`, which we read
    # directly. This avoids both unreliable channels tried before — a PR comment
    # (the one-shot's track_progress placeholder was flaky) and the execution-log
    # file (its path is coupled to the action version and broke on a bump).
    outputs:
      verdict_line: ${{ steps.parse.outputs.verdict_line }}
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
    env:
      REVIEW_BOT: 'claude[bot]'
    steps:
      # SHA-pinned actions/checkout v7.0.1 (the extractor reads ./REVIEW.md from
      # the workspace, so the action's agent needs a checkout to read it).
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Fetch the review comment into ./REVIEW.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          # The review is the review bot's comment that links this run: the
          # action's tracking comment carries a job link ending in
          # /actions/runs/<run id>). An @claude reply posted while the review
          # ran, or an earlier run's review, links another run, so neither can
          # become the verdict input; a re-run keeps the run id. When no comment
          # links this run the step fails and the gate reads INCONCLUSIVE.
          # Pass it to the extractor as a file (not inline in the prompt) to
          # avoid prompt injection from the review/PR text.
          # --slurp joins the pages first: a --jq filter runs once per page, so
          # `last` there would emit one comment per page on a long thread.
          gh api "repos/$REPO/issues/$PR/comments" --paginate --slurp \
            | jq -r --arg bot "$REVIEW_BOT" --arg run "$RUN_ID" \
                'add | map(select(.user.login == $bot and (.body | contains("/actions/runs/" + $run + ")")))) | last | .body // empty' > REVIEW.md
          if [ ! -s REVIEW.md ]; then
            echo "No comment by $REVIEW_BOT links this run ($RUN_ID); extractor cannot run." >&2
            exit 1
          fi

          # THE REVIEW JOB CAN REPORT SUCCESS HAVING POSTED ONLY A PROGRESS
          # PLACEHOLDER. When the review agent cannot run — an API rate limit is
          # the usual cause, and the lab's repos share one account so concurrent
          # CI across repos trips it — the action still writes "I'll analyze this
          # and get back to you" and exits 0. The gate's REVIEW_RESULT check
          # (which treats a non-success review as a transient throttle) never
          # fires, the extractor finds no HIGH/CRITICAL in a comment that
          # contains nothing, and the gate reports PASS on a pull request nobody
          # reviewed. A gate that cannot tell "reviewed and clean" from "never
          # reviewed" is worse than a red one, because it looks like evidence.
          #
          # The REMEDY DIFFERS from every other failure here, which is why it is
          # named rather than left to the generic message: `gh run rerun --failed`
          # re-runs only the extractor, which re-reads the same placeholder and
          # fails identically. The whole workflow has to run again so the REVIEW
          # job runs again.
          #
          # Detected by size, NOT by matching the placeholder text. Matching the
          # text rejects any real review that quotes it — which is exactly what
          # happened to the review of the PR that introduced this guard. The
          # review writes its own heading so there is no fixed marker to require;
          # what placeholders have in common is carrying no findings at all.
          # Measured corpus: shortest real review 836 bytes, placeholders 190 and
          # under.
          bytes=$(wc -c < REVIEW.md | tr -d ' ')
          if [ "$bytes" -lt 400 ]; then
            echo "::error::The review bot's latest comment is ${bytes} bytes, which is a progress placeholder rather than a review. RE-RUN THE WHOLE WORKFLOW (gh run rerun <id>), not just the failed jobs: --failed re-runs this extractor against the same placeholder and fails again. Comment follows:" >&2
            cat REVIEW.md >&2
            exit 1
          fi


      # SHA-pinned anthropics/claude-code-action v1.0.271 Cheap model (Haiku) —
      # this is a one-shot classification, not a review. With a prompt and no
      # track_progress the action runs in agent mode, which adds no tools of
      # its own. Reads inside the workspace need no allow rule, so naming only
      # ./REVIEW.md (rather than a bare `Read`, which allows any path) keeps
      # paths outside the workspace denied; the deny keeps the agent out of
      # .git/config, where the action writes the App token. The verdict comes
      # back as schema-validated STRUCTURED OUTPUT (the `--json-schema`
      # claude_arg), exposed as steps.extract.outputs.structured_output — no
      # comment, no log-file parse.
      - name: Extract the merge verdict
        id: extract
        uses: anthropics/claude-code-action@4fa93a88de49bbef68b10eb15aabedf28ca0e1ed # v1.0.271
        env:
          # Strips Anthropic, cloud and Actions credentials (the OAuth token,
          # the OIDC request token) from the environment of the processes the
          # agent starts. GH_TOKEN stays, because `gh` needs it, which is why
          # the deny lists keep gh's --jq and --template out of reach.
          CLAUDE_CODE_SUBPROCESS_ENV_SCRUB: "1"
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # track_progress off: this is a data task, not a PR conversation; we read
          # the result from structured_output, not a comment.
          track_progress: false
          # The extractor writes nothing to GitHub, so every key of the App
          # token it is given drops to read (`pull_requests` with an underscore,
          # the API's spelling; a hyphenated key would leave the write default).
          additional_permissions: |
            contents: read
            pull_requests: read
            issues: read
          claude_args: |
            --model haiku
            --tools "Read"
            --allowedTools "Read(./REVIEW.md)"
            --disallowedTools "Bash,Monitor,Read(./.git/**),Read(//proc/**),Read(//home/runner/work/_temp/**)"
            --json-schema '{"type":"object","properties":{"verdict":{"type":"string","enum":["PASS","BLOCK"]},"count":{"type":"integer","minimum":0}},"required":["verdict","count"],"additionalProperties":false}'
          prompt: >-
            Read the file ./REVIEW.md in the repository — it is an automated code review of this
            pull request. Your ONLY task is to report its merge verdict. Count the findings the
            review itself rates HIGH or CRITICAL severity (a "CI Tests" FAILURE called out in the
            review also counts). Do NOT re-judge the diff, do NOT add findings of your own, and do
            NOT count MEDIUM/LOW findings, missing-test notes, or anything the review did not label
            HIGH/CRITICAL. Return verdict="PASS" with count=0 when the review has zero HIGH/CRITICAL
            findings; otherwise verdict="BLOCK" with count set to the number of HIGH/CRITICAL findings.

      - name: Build the verdict line from the structured output
        id: parse
        env:
          STRUCTURED: ${{ steps.extract.outputs.structured_output }}
        run: |
          set -uo pipefail
          # structured_output is schema-validated JSON, e.g. {"verdict":"PASS","count":0}.
          # Reconstruct the same MERGE-VERDICT-GATE line the gate already parses, so
          # the gate logic is unchanged. Empty/garbled output -> empty line ->
          # INCONCLUSIVE (never a silent PASS).
          v=$(printf '%s' "${STRUCTURED:-}" | jq -r '.verdict // empty' 2>/dev/null || true)
          c=$(printf '%s' "${STRUCTURED:-}" | jq -r '.count // empty'   2>/dev/null || true)
          line=""
          if [ "$v" = "PASS" ] || [ "$v" = "BLOCK" ]; then
            printf '%s' "$c" | grep -qE '^[0-9]+$' || c=0
            line="MERGE-VERDICT-GATE VERDICT=$v COUNT=$c"
          fi
          echo "structured_output: ${STRUCTURED:-<none>}"
          echo "Parsed verdict line: ${line:-<none>}"
          echo "verdict_line=$line" >> "$GITHUB_OUTPUT"

  # A push makes any earlier `review-ack` stale: it acknowledged findings on code
  # that has since changed. Remove the label on every push so a maintainer has
  # to acknowledge the new head. Same-repository PRs only: a fork PR's
  # GITHUB_TOKEN is read-only, and for those the gate's own timing check (the
  # ack must postdate this run) is what keeps an old ack from counting.
  clear-stale-ack:
    if: ${{ github.event.action == 'synchronize' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Remove a review-ack applied before this push
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          ACK_LABEL: review-ack
        run: |
          set -euo pipefail
          if gh pr view "$PR" --repo "$REPO" --json labels --jq '.labels[].name' | grep -qx "$ACK_LABEL"; then
            gh api -X DELETE "repos/$REPO/issues/$PR/labels/$ACK_LABEL" >/dev/null
            echo "Removed $ACK_LABEL: it was applied before this push."
          else
            echo "No $ACK_LABEL label to remove."
          fi

  # ---------------------------------------------------------------------------
  # Merge gate. Reads the verdict extractor's line and FAILS this check when the
  # review reported a HIGH/CRITICAL finding, so the PR cannot merge until the
  # latest review is clean. Three outcomes:
  #
  #   PASS          - extractor emitted VERDICT=PASS (no HIGH/CRITICAL). Check green.
  #   BLOCK         - extractor emitted VERDICT=BLOCK (>=1). Check red. Push a fix
  #                   (the review + extractor re-run on each push and can clear it),
  #                   or a MAINTAINER applies the `review-ack` label and re-runs
  #                   the failed jobs to override.
  #   INCONCLUSIVE  - the review or the extractor did not complete (transient API
  #                   throttle) OR no parseable verdict was found. Check red, but
  #                   distinct and re-runnable: a flaky pass must NEVER read as PASS.
  #
  # The `review-ack` override is access-controlled and scoped: it counts only when
  # the label was applied by someone with write/maintain/admin permission AND at or
  # after the moment GitHub created this workflow run. The run's `created_at` is
  # set by GitHub when the triggering event arrives and stays fixed when a job
  # is re-run, so an ack applied after a BLOCK counts on "Re-run failed jobs",
  # while an ack from before the latest push never does. (A commit's committer
  # date is not used: the author sets it.) If either timestamp cannot be read,
  # the override is refused. The PR's author cannot apply it to their own PR:
  # the ack must come from another maintainer. Admin-bypass on branch
  # protection remains the emergency break-glass.
  #
  # ROLLOUT (per-repo): OBSERVE-ONLY until a maintainer adds the `review-gate`
  # check to the branch's required status checks. Create the label once:
  #   gh label create review-ack -c '0E8A16' \
  #     -d 'Maintainer override: merge despite a blocking Claude review finding'
  # ---------------------------------------------------------------------------
  review-gate:
    needs: [claude-review, verdict-extract]
    # !cancelled(): the gate must still run (and report INCONCLUSIVE) when the
    # review or extractor errored, because `needs` would otherwise SKIP it and
    # a skipped required check could be misread as non-blocking. A run that a
    # newer push cancelled posts no gate comment; the newer run gates. Skip
    # only for dependabot.
    if: ${{ !cancelled() && github.event.pull_request.user.login != 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      actions: read
    steps:
      - name: Evaluate the verdict
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          RUN_ID: ${{ github.run_id }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          REVIEW_RESULT: ${{ needs.claude-review.result }}
          EXTRACT_RESULT: ${{ needs.verdict-extract.result }}
          VERDICT_LINE: ${{ needs.verdict-extract.outputs.verdict_line }}
          REVIEW_BOT: 'claude[bot]'
          ACK_LABEL: review-ack
          MARKER: '### Review Gate'
        run: |
          set -euo pipefail
          verdict=""; count="0"; reason=""; gate="BLOCK"

          # 1) INCONCLUSIVE if the review or the extractor didn't complete.
          if [ "$REVIEW_RESULT" != "success" ]; then
            verdict="INCONCLUSIVE"
            reason="The Claude review did not complete (job result: \`${REVIEW_RESULT}\`). Usually a transient API throttle, not a code finding."
          elif [ "$EXTRACT_RESULT" != "success" ]; then
            verdict="INCONCLUSIVE"
            reason="The verdict extractor did not complete (job result: \`${EXTRACT_RESULT}\`)."
          else
            # 2) Read the verdict from the extractor's JOB OUTPUT (parsed from the
            # agent's execution log, not a PR comment — the comment channel is
            # unreliable for a one-shot). The extractor job succeeded (checked
            # above); an empty/garbled line here means the agent emitted nothing
            # parseable, which is INCONCLUSIVE (never a silent PASS).
            line=$(printf '%s' "$VERDICT_LINE" | grep -oE 'MERGE-VERDICT-GATE VERDICT=(PASS|BLOCK) COUNT=[0-9]+' | tail -1 || true)
            if [ -z "$line" ]; then
              verdict="INCONCLUSIVE"
              reason="The verdict extractor produced no parseable \`MERGE-VERDICT-GATE VERDICT=...\` line."
            else
              verdict=$(printf '%s' "$line" | sed -E 's/.*VERDICT=([A-Z]+).*/\1/')
              count=$(printf '%s' "$line" | sed -E 's/.*COUNT=([0-9]+).*/\1/')
              # The pair must agree: PASS with findings, or BLOCK with none,
              # means the extractor misread the review.
              if { [ "$verdict" = "PASS" ] && [ "$count" -ne 0 ]; } || \
                 { [ "$verdict" = "BLOCK" ] && [ "$count" -eq 0 ]; }; then
                reason="The verdict extractor returned VERDICT=${verdict} with COUNT=${count}, which contradict each other."
                verdict="INCONCLUSIVE"
              fi
            fi
          fi

          # 3) review-ack override: maintainer-applied AND applied after this run
          #    was created (see the header for why the run, not the commit).
          override="no"; ack_actor=""
          if gh pr view "$PR" --repo "$REPO" --json labels --jq '.labels[].name' 2>/dev/null | grep -qx "$ACK_LABEL"; then
            # --slurp joins the pages first (see the REVIEW.md fetch above).
            ev=$(gh api "repos/$REPO/issues/$PR/events" --paginate --slurp 2>/dev/null \
              | jq -c --arg l "$ACK_LABEL" 'add | map(select(.event == "labeled" and .label.name == $l)) | last // {}' 2>/dev/null || echo '{}')
            ack_actor=$(printf '%s' "$ev" | jq -r '.actor.login // ""' 2>/dev/null || echo "")
            applied_at=$(printf '%s' "$ev" | jq -r '.created_at // ""' 2>/dev/null || echo "")
            run_at=$(gh api "repos/$REPO/actions/runs/$RUN_ID" --jq '.created_at // ""' 2>/dev/null || echo "")
            perm="none"
            if [ -n "$ack_actor" ]; then
              perm=$(gh api "repos/$REPO/collaborators/$ack_actor/permission" --jq '.permission // "none"' 2>/dev/null || echo none)
            fi
            # Both timestamps are GitHub's own UTC ISO-8601 strings, which sort
            # lexically, so `sort -c` over run,applied succeeds iff applied >= run.
            # An empty value on either side refuses the override.
            scoped="no"
            if [ -n "$applied_at" ] && [ -n "$run_at" ] && \
               printf '%s\n%s\n' "$run_at" "$applied_at" | sort -c >/dev/null 2>&1; then
              scoped="yes"
            fi
            case "$perm" in admin|maintain|write) maint="yes" ;; *) maint="no" ;; esac
            if [ "$scoped" = "yes" ] && [ "$maint" = "yes" ] && \
               [ -n "$PR_AUTHOR" ] && [ "$ack_actor" != "$PR_AUTHOR" ]; then
              override="yes"
            fi
          fi

          # 4) Decide.
          if [ "$verdict" = "PASS" ]; then
            gate="PASS"; reason="Review reported no HIGH/CRITICAL findings."
          elif [ "$override" = "yes" ]; then
            gate="PASS"; reason="Overridden via \`${ACK_LABEL}\` (applied by maintainer @${ack_actor} after GitHub created this run for the current head). Original verdict: ${verdict}${count:+, ${count} blocking}."
          fi

          # 5) Post a sticky gate comment.
          # The backticks below are Markdown code spans in the comment text, not
          # command substitution.
          # shellcheck disable=SC2016
          {
            printf '%s\n\n' "$MARKER"
            case "$gate:$verdict" in
              PASS:PASS)        printf '✅ **Gate: PASS** — %s\n' "$reason" ;;
              PASS:*)           printf '✅ **Gate: PASS (override)** — %s\n' "$reason" ;;
              BLOCK:BLOCK)      printf '🛑 **Gate: BLOCK** — the review reported %s HIGH/CRITICAL finding(s). Address them and push (the review re-runs on each push), or a maintainer can apply the `%s` label and then re-run this check (Re-run failed jobs) to override.\n' "$count" "$ACK_LABEL" ;;
              *:INCONCLUSIVE)   printf '⚠️ **Gate: INCONCLUSIVE** — %s Push a new commit to re-run the checks (they re-run on every push), or a maintainer can apply the `%s` label and then re-run this check (Re-run failed jobs).\n' "$reason" "$ACK_LABEL" ;;
              *)                printf '🛑 **Gate: BLOCK** — %s\n' "$reason" ;;
            esac
            # NOTE: intentionally no "observe-only" footer. Whether this gate is a
            # required (merge-blocking) check varies per repo/branch and changes
            # over time; a hard-coded claim goes stale (it falsely read
            # "observe-only" after the gate was made required across the lab).
            # GitHub's checks UI already marks required checks; the verdict lines
            # above tell the reader what to do regardless of enforcement.
          } > gate-comment.md
          gh api --paginate "repos/$REPO/issues/$PR/comments" \
            --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"$MARKER\"))) | .id" 2>/dev/null \
          | while read -r id; do gh api -X DELETE "repos/$REPO/issues/comments/$id" >/dev/null 2>&1 || true; done
          gh pr comment "$PR" --repo "$REPO" --body-file gate-comment.md || true
          # (No raw extractor comment to tidy: the verdict now travels as a job
          # output, so the extractor posts nothing to the thread. The visible
          # comments are the review, semgrep, CI, and this gate verdict.)

          # 6) Set the check result.
          if [ "$gate" = "PASS" ]; then
            echo "review-gate: PASS — $reason"
          else
            echo "review-gate: ${verdict} — $reason"
            exit 1
          fi
