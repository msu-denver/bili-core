# The interactive `@claude` bot: responds to `@claude` mentions in issues, PR
# comments, PR review comments, and PR reviews.
#
# Trust rule: the actor AND the author of the thread it is working on must both
# have write access. A trusted maintainer commenting on an outside contributor's
# issue or PR would otherwise hand attacker-written text (the issue body, the PR
# description, the diff) to the agent. The job's `if` only matches the event
# and the `@claude` text, so a comment without a mention never starts a runner.
# It does not read author_association: on an organization's repository the
# event payload reports a member whose membership is private as CONTRIBUTOR,
# so that filter turned the bot away from the people it serves, and MEMBER or
# COLLABORATOR also covers read-only and triage users. The gate is the
# `trusted` step: it asks the collaborators API for the permission of the
# thread author and of the commenter, and unless both are admin, maintain or
# write, the job stops before the checkout and the agent. The action checks
# the commenter's write access again itself. Inside the thread, only comments
# by people with write access reach the agent's prompt
# (include_comments_by_actor below).
#
# Pull requests from forks are skipped even when the author is trusted: the
# action checks out the PR branch, and a fork branch is code from outside this
# repository.
#
# Auth: CLAUDE_CODE_OAUTH_TOKEN (subscription token, no metered API key). The
# action exchanges the job's OIDC token for a short-lived token of the Claude
# GitHub App, so `id-token: write` is required. The workflow permissions below
# limit only GITHUB_TOKEN; what the App token can do is set by the App
# installation's permissions, which are the real ceiling on the agent.
#
# Permissions: `contents: read` because the bot does not push branches (it
# replies with fix links a maintainer clicks), `pull-requests: read` and
# `issues: read` for the steps below that read the thread, `actions: read` to
# read CI results. The replies are posted with the App token, whose
# `pull_requests` and `issues` keys stay at their write default in
# `additional_permissions` below.
#
# The CLAUDE_CODE_OAUTH_TOKEN repository secret must be provisioned by a
# maintainer.

name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      ((github.event_name == 'issue_comment' &&
        contains(github.event.comment.body, '@claude')) ||
       (github.event_name == 'pull_request_review_comment' &&
        contains(github.event.comment.body, '@claude')) ||
       (github.event_name == 'pull_request_review' &&
        contains(github.event.review.body, '@claude')) ||
       (github.event_name == 'issues' &&
        (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude'))))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
      actions: read
    steps:
      # The fork check reads the event payload and asks the API for PR contexts
      # only; issues never come from a fork. Any lookup failure fails the job
      # rather than letting the agent run on an unknown branch.
      - name: Skip pull requests from forks
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          pr=$(jq -r 'if .pull_request then .pull_request.number elif .issue.pull_request then .issue.number else empty end' "$GITHUB_EVENT_PATH")
          if [ -z "$pr" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          cross=$(gh pr view "$pr" --repo "$REPO" --json isCrossRepository --jq .isCrossRepository)
          case "$cross" in
            false) echo "skip=false" >> "$GITHUB_OUTPUT" ;;
            true)
              echo "::notice::PR #$pr comes from a fork; the bot does not run on fork branches."
              echo "skip=true" >> "$GITHUB_OUTPUT" ;;
            *)
              echo "::error::Could not tell whether PR #$pr comes from a fork (got '$cross')."
              exit 1 ;;
          esac

      # Write access means what the collaborators API reports for a login:
      # admin, maintain or write. author_association is not enough, because on
      # an organization's repository MEMBER and COLLABORATOR also cover
      # read-only and triage users, and a private member shows as CONTRIBUTOR.
      # Each login is asked once, and a lookup that fails counts as no access.
      # This step is the bot's only gate, since the job's `if` checks no one.
      # The thread author comes first, then the commenter: the author of the
      # comment or review that mentions @claude, or for an issue event the
      # sender who opened or assigned it. When either lacks write access the
      # step sets run=false and logs why, and the agent's steps are skipped.
      # Then everyone else in the thread: the action puts its comments,
      # reviews and review comments into the agent's prompt, and
      # include_comments_by_actor (below) keeps out every author this step
      # does not list.
      # Two bots are added by name: github-actions[bot] (the workflows' own
      # sticky comments) and claude[bot] (this bot's earlier replies). The
      # action gives a GraphQL Bot author its [bot] suffix before it matches,
      # and no user login can contain brackets, so neither name admits a user
      # account (an unrelated user does hold the bare login `claude`). The
      # list is never empty, which matters: an empty list admits everyone.
      - name: Check this thread's authors for write access
        id: trusted
        if: steps.guard.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          can_write() {
            local login=$1
            perm=$(gh api "repos/$REPO/collaborators/$login/permission" --jq .permission) || {
              echo "::warning::Could not read the permission of $login."
              perm=none
            }
            case "$perm" in
              admin|maintain|write) return 0 ;;
            esac
            return 1
          }
          author=$(jq -r '(.issue // .pull_request).user.login // empty' "$GITHUB_EVENT_PATH")
          if [ -z "$author" ] || ! can_write "$author"; then
            echo "::notice::The thread's author ${author:-(none)} does not have write access (${perm:-no login}); the bot does not run."
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          actor=$(jq -r '(.comment // .review).user.login // .sender.login // empty' "$GITHUB_EVENT_PATH")
          perm=
          if [ -z "$actor" ] || { [ "$actor" != "$author" ] && ! can_write "$actor"; }; then
            echo "::notice::The commenter ${actor:-(none)} does not have write access (${perm:-no login}); the bot does not run."
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          n=$(jq -r '.issue.number // .pull_request.number' "$GITHUB_EVENT_PATH")
          people='.[] | select(.user.type != "Bot") | .user.login // empty'
          {
            gh api "repos/$REPO/issues/$n/comments" --paginate --jq "$people"
            if jq -e '.pull_request or .issue.pull_request' "$GITHUB_EVENT_PATH" >/dev/null; then
              gh api "repos/$REPO/pulls/$n/reviews" --paginate --jq "$people"
              gh api "repos/$REPO/pulls/$n/comments" --paginate --jq "$people"
            fi
          } | sort -u > "$RUNNER_TEMP/commenters.txt"
          printf '%s\n' 'github-actions[bot]' 'claude[bot]' "$author" "$actor" > "$RUNNER_TEMP/trusted-authors.txt"
          while read -r login; do
            if [ "$login" != "$author" ] && [ "$login" != "$actor" ] && can_write "$login"; then
              printf '%s\n' "$login" >> "$RUNNER_TEMP/trusted-authors.txt"
            fi
          done < "$RUNNER_TEMP/commenters.txt"
          echo "actors=$(sort -u "$RUNNER_TEMP/trusted-authors.txt" | paste -sd, -)" >> "$GITHUB_OUTPUT"
          echo "run=true" >> "$GITHUB_OUTPUT"

      - name: Check out the repository
        if: steps.guard.outputs.skip == 'false' && steps.trusted.outputs.run == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      # Tools: read and search only. The action adds its own tools to whatever
      # --allowedTools names (git add/commit/rm and its git-push.sh wrapper, or
      # the commit_files and delete_files MCP tools when commit signing is on,
      # plus file edits through its acceptEdits permission mode), so the allow
      # list alone restricts nothing. --tools does: it names every built-in
      # tool the agent has, so any other, including ones a later CLI adds,
      # does not exist in the session. Bash is not the only tool that runs
      # commands (Monitor does too, and a Bash deny does not cover it).
      # ToolSearch loads MCP tools the CLI defers; MCP tools are not built-in
      # and stay. The deny list is the second layer: a deny rule beats every
      # allow rule, and the bare `Bash` and `Monitor` entries remove the shell,
      # which takes the action's git and push tools with it. No git commands
      # either, because git accepts abbreviated long options (`--outp=` for
      # `--output=`) that no pattern list can pin.
      #
      # The action also allows Read on any path, so the Read denies keep the
      # agent away from where this job's credentials sit on the runner: the
      # process environment under /proc, .git/config, where the action writes
      # the App token into the remote URL, and the runner temp folder, where a
      # checkout that persists credentials writes them. The same rules stop
      # Grep from reading those files. CLAUDE_CODE_SUBPROCESS_ENV_SCRUB keeps the
      # Anthropic, cloud and Actions credentials out of any child process's
      # environment; the action turns it on only with allowed_non_write_users.
      - name: Run Claude Code
        if: steps.guard.outputs.skip == 'false' && steps.trusted.outputs.run == 'true'
        uses: anthropics/claude-code-action@4fa93a88de49bbef68b10eb15aabedf28ca0e1ed # v1.0.271
        env:
          CLAUDE_CODE_SUBPROCESS_ENV_SCRUB: "1"
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          include_fix_links: true
          track_progress: true
          include_comments_by_actor: ${{ steps.trusted.outputs.actors }}
          # The action asks for an App token with contents, pull_requests and
          # issues all `write` unless these lines override a key; the token's
          # reach is the agent's real ceiling, so contents drops to read (the
          # bot does not push). Keys use the API's spelling, `pull_requests`
          # with an underscore: a hyphenated key is a different, unknown key
          # and leaves the default in place.
          additional_permissions: |
            actions: read
            contents: read
          claude_args: >-
            --tools "Read,Grep,Glob,ToolSearch"
            --allowedTools "Read,Grep,Glob"
            --disallowedTools "Bash,Monitor,Edit,MultiEdit,Write,NotebookEdit,WebFetch,WebSearch,mcp__github_file_ops__commit_files,mcp__github_file_ops__delete_files,Read(./.git/**),Read(//proc/**),Read(//home/runner/work/_temp/**)"
