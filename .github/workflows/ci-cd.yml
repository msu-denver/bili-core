name: Bili Core CI/CD Pipeline

on:
    # Run on PRs against any branch (gates merges via branch protection's
    # required status check), and on direct pushes to the protected branches
    # main and develop (covers post-merge runs and admin-bypass pushes).
    # Feature-branch pushes do not double-trigger CI; the pull_request
    # event covers them once a PR is open.
    pull_request:
    push:
        branches: [main, develop]

# Auto-cancel superseded in-progress runs for the same PR/ref so a rapid
# series of pushes doesn't queue redundant heavy test runs. Cancellation is
# scoped to pull_request events only: pushes to the protected branches
# main/develop always run to completion so a release-path run is never
# cancelled mid-flight.
concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Default GITHUB_TOKEN permissions for every job in this workflow. Limited to
# contents:read so an attacker who modifies a script that runs in CI (such as
# scripts/build/build-and-test.sh) cannot use the token to write to the repo,
# even on internal-collaborator PRs that bypass the outside-collaborator
# approval gate. Fork PRs already get a read-only token by GitHub default;
# this block extends that default to internal PRs as well.
permissions:
    contents: read

jobs:
    # Build the application on any branch commit
    build-application:
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            # Checkout code
            - name: Checkout code
              uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

            # Set up Python
            - name: Set up Python
              uses: actions/setup-python@7f4fc3e22c37d6ff65e88745f38bd3157c663f7c # v4.9.1
              with:
                python-version: '3.11'

            # Install required dependencies
            - name: Install dependencies
              run: |
                if command -v sudo > /dev/null 2>&1; then 
                  sudo apt-get update && sudo apt-get install -y jq zip zstd;
                else 
                  apt-get update && apt-get install -y jq zip zstd;
                fi
                pip install pylint
              shell: bash

            # Run pylint on Lambda code
            - name: Run pylint on code
              run: |
                pylint bili/ --disable=import-error --fail-under=9

            # Build package (this step only packages the dist/ artifact; the
            # actual test suite runs in the separate test-application job below.
            # scripts/build/build-and-test.sh is named for historical reasons and
            # does not run pytest.)
            - name: Build package
              run: ./scripts/build/build-and-test.sh

            # NOTE: No cache/save or upload-artifact step here intentionally.
            # bili-core is a shared library with no downstream deploy jobs (no ECR/ECS),
            # so caching dist/ would waste GitHub Actions storage quota (~3.5 GB per entry)
            # with nothing ever restoring it.

    # Run the full pytest suite. Separate from build-application so the lint
    # gate can fail fast without paying for the heavy dependency install, and
    # so the two concerns (static checks vs. behavioral tests) are independent
    # required status checks.
    test-application:
        runs-on: ubuntu-latest
        timeout-minutes: 30
        steps:
            - name: Checkout code
              uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

            - name: Set up Python
              uses: actions/setup-python@7f4fc3e22c37d6ff65e88745f38bd3157c663f7c # v4.9.1
              with:
                python-version: '3.11'
                # Cache the pip download/build artifacts keyed on both
                # requirements.txt (lean core) and setup.py (extras pins)
                # so the cache invalidates when either changes.
                cache: 'pip'
                cache-dependency-path: |
                  requirements.txt
                  setup.py

            # Full dependency install: [all] brings the complete runtime stack
            # (torch, transformers, faiss, mongo, etc.) that the test suite
            # exercises; [dev] adds pytest, pytest-cov, mongomock, and pympler
            # which are no longer in requirements.txt (they are dev-only tools).
            - name: Install dependencies
              run: |
                python -m pip install --upgrade pip
                pip install -e ".[all,dev]"
              shell: bash

            # Run the full test suite with coverage. No skips or errors are
            # tolerated; the mongomock-backed checkpointer tests and the AEGIS
            # structural fixtures mean the suite runs fully without external
            # services. Coverage is scoped to runtime code via .coveragerc
            # (the test tree is omitted so it cannot inflate the numbers).
            - name: Run pytest with coverage
              run: |
                pytest bili/ -q --tb=short \
                  --cov=bili --cov-report=json:coverage.json
              shell: bash

            # Per-file coverage gate: every runtime file must reach >= 90% line
            # coverage. This is a required check, not an average; a single file
            # below threshold fails the build. See scripts/check_coverage.py.
            - name: Enforce per-file coverage gate (>= 90%)
              run: |
                python scripts/check_coverage.py
              shell: bash
