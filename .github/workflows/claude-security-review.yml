name: Claude Security Review

on:
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  pull-requests: write
  contents: read

jobs:
  security-review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2

      - name: Run Claude Security Review
        # Pinned to main HEAD as of 2026-02-11. The security-review action
        # does not currently publish semver tags; track the SHA and bump
        # manually after auditing main history.
        uses: anthropics/claude-code-security-review@0c6a49f1fa56a1d472575da86a94dbc1edb78eda
        with:
          claude-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          comment-pr: true
          upload-results: true
          claude-model: claude-sonnet-4-5-20250929
          claudecode-timeout: 20
          exclude-directories: node_modules,dist,.git,venv,__pycache__,build
