# Dependabot configuration for bili-core.
#
# Tracks updates for:
#   - Python packages declared in requirements.txt
#   - GitHub Actions referenced in .github/workflows/
#   - Docker base image declared in the Dockerfile
#
# Dependabot opens one PR per outdated dependency, grouped where it makes sense
# to keep review burden manageable. Security updates run independently of this
# schedule via the "Dependabot security updates" repo setting.

version: 2
# Every ecosystem waits 7 days after a release before Dependabot proposes it
# (cooldown): a compromised or mistaken release is usually caught within days.
# Security updates are not delayed.
updates:
  # Python dependencies
  - package-ecosystem: "pip"
    cooldown:
      default-days: 7
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "America/Denver"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "python"
    commit-message:
      prefix: "deps"
      include: "scope"
    # Major versions the google-cloud group would otherwise propose, held back
    # by constraints documented in requirements.txt:
    # - google-genai 3.x cannot resolve while google-cloud-aiplatform, 1.x and
    #   2.x alike, requires google-genai<3. Remove when aiplatform admits 3.x.
    # - google-cloud-aiplatform 2.10 allows protobuf<8, which moves the lean
    #   core and [all] from protobuf 6.x to 7.x. Remove once the suite passes
    #   on protobuf 7.
    ignore:
      - dependency-name: "google-genai"
        update-types: ["version-update:semver-major"]
      - dependency-name: "google-cloud-aiplatform"
        update-types: ["version-update:semver-major"]
    groups:
      langchain-ecosystem:
        patterns:
          - "langchain*"
          - "langgraph*"
      llm-providers:
        patterns:
          - "langchain-aws"
          - "langchain-anthropic"
          - "langchain-openai"
          - "langchain-google-vertexai"
          - "langchain-huggingface"
      google-cloud:
        patterns:
          - "google-*"
          - "googleapis-common-protos"
          - "proto-plus"
          - "grpc-google-iam-v1"
      ml-frameworks:
        patterns:
          - "torch*"
          - "transformers"
          - "accelerate"
          - "sentence-transformers"
          - "tensorflow*"
          - "tf-keras"
          - "keras"
      dev-tooling:
        patterns:
          - "black"
          - "isort"
          - "autoflake"
          - "pylint*"
          - "pre-commit"
          - "pytest*"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    cooldown:
      default-days: 7
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "America/Denver"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "ci"
      include: "scope"
    groups:
      actions:
        patterns:
          - "*"

  # Docker base image (Dockerfile)
  - package-ecosystem: "docker"
    cooldown:
      default-days: 7
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "America/Denver"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "docker"
    commit-message:
      prefix: "deps"
      include: "scope"
    groups:
      docker:
        patterns:
          - "*"
