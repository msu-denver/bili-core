[pytest]
# Root pytest configuration. Without this, running `pytest bili/` from the repo
# root does not pick up the per-suite pytest.ini marker registrations under
# bili/aegis/tests/<suite>/, producing PytestUnknownMarkWarning noise. CI runs
# pytest from the root, so the markers must be registered here.

testpaths = bili
python_files = test_*.py
python_classes = Test*
python_functions = test_*

markers =
    structural: CI-safe structural assertions (stub + LLM), Tier 1 detection
    heuristic: heuristic detection tests, logged only, not a hard assertion
    semantic: semantic evaluation tests, LLM mode only, skipped in stub mode
